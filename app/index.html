    if(type==="frame"){const x=snapshot.frames.find(f=>f.n===row.n);x?x.status=row.status:snapshot.frames.push(row)}
  };
  const publishEvent=event=>{notify(event);if(channel)channel.postMessage({kind:"event",event})};
  if(channel){
    channel.onmessage=e=>{
      const m=e.data||{};
      if(m.kind==="event"){applyEvent(m.event);notify(m.event)}
      if(m.kind==="heartbeat")peers.set(m.id,Date.now());
      if(m.kind==="bye")peers.delete(m.id);
    };
    const heartbeat=()=>channel.postMessage({kind:"heartbeat",id});
    heartbeat();const timer=setInterval(heartbeat,2000);
    root.addEventListener&&root.addEventListener("beforeunload",()=>{clearInterval(timer);channel.postMessage({kind:"bye",id});channel.close()});
  }
  function presence(fn){const f=()=>{const now=Date.now();let count=1;peers.forEach(t=>{if(now-t<6500)count++});fn(count)};
    presences.add(fn);f();const timer=setInterval(f,1500);return()=>{presences.delete(fn);clearInterval(timer)}}
  async function init(){
    if(initializing)return initializing;
    initializing=(async()=>{
      try{
        spatial=new (config.Store||root.IFSpatial.Store)();
        await spatial.open();
        snapshot=await spatial.loadCompatible();
        if(!snapshot){
          const legacy=await config.legacyLoad();
          await spatial.importLegacy(legacy);
          snapshot=await spatial.loadCompatible();
        }
        if(!snapshot)throw Error("Spatial migration did not produce a readable snapshot");
        return snapshot;
      }catch(err){
        console.warn("Spatial storage not available, using original local mode:",err);
        spatial=null;
        fallback=config.fallback();
        for(const handler of listeners)fallback.subscribe(handler);
        snapshot=await fallback.load();
        return snapshot;
      }
    })();return initializing;
  }
  async function commit(payload){
    await init();
    if(fallback)return fallback.publish(payload);
    const current=latest();
    const boundaries=[...current.boundaries],items=[...current.items],events=[...current.events];
    for(const b of payload.boundaries||[])if(!boundaries.some(x=>x.id===b.id))boundaries.push(b);
    for(const i of payload.items||[])if(!items.some(x=>x.id===i.id))items.push(i);
    for(const e of payload.events||[])if(!events.some(x=>x.id===e.id))events.push(e);
    const next={...current,boundaries,items,events};
    await spatial.putPublication(payload,{frames:next.frames,messages:next.messages,votes:next.votes,events:next.events});
    snapshot=next;
    for(const b of payload.boundaries||[])publishEvent({type:"boundary",row:b});
    for(const i of payload.items||[])publishEvent({type:"item",row:i});
    for(const e of payload.events||[])publishEvent({type:"event",row:e});
  }
  const backend={
    mode:"local-spatial",
    get spatial(){return spatial},
    load:init,
    subscribe(fn){listeners.add(fn);return()=>listeners.delete(fn)},
    onPresence:presence,
    async publish(payload){return commit(payload)},
    async openNextFrame(n,events){
      await init();if(fallback)return fallback.openNextFrame(n,events);
      const next={...latest(),frames:latest().frames.map(f=>f.n===n?{...f,status:"published"}:f),events:[...latest().events]};
      if(!next.frames.some(f=>f.n===n+1))next.frames.push({n:n+1,status:"open"});
      for(const e of events||[])if(!next.events.some(x=>x.id===e.id))next.events.push(e);
      await spatial.saveState({frames:next.frames,events:next.events});snapshot=next;
      publishEvent({type:"frame",row:{n,status:"published"}});
      publishEvent({type:"frame",row:{n:n+1,status:"open"}});
      (events||[]).forEach(e=>publishEvent({type:"event",row:e}));
    },
    async sendMessage(message){
      await init();if(fallback)return fallback.sendMessage(message);
      const messages=[...latest().messages];
      if(!messages.some(m=>m.id===message.id))messages.push(message);
      await spatial.saveState({messages});snapshot={...latest(),messages};publishEvent({type:"message",row:message});
    },
    async vote(vote){
      await init();if(fallback)return fallback.vote(vote);
      const votes=[...latest().votes];
      if(!votes.some(v=>v.msgId===vote.msgId&&v.voterId===vote.voterId))votes.push(vote);
      await spatial.saveState({votes});snapshot={...latest(),votes};publishEvent({type:"vote",row:vote});
    },
    async searchRegions(query,options){
      await init();
      if(spatial)return spatial.search(query,options);
      const q=String(query||"").toLowerCase();return latest().boundaries.filter(r=>String(r.name||"").toLowerCase().startsWith(q)).slice(0,30).map(x=>({id:x.id,name:x.name,frameN:x.frameN,bbox:root.IFSpatial.boundsFromPath(x.d),color:x.color}))
    },
    async browseRegions(options={}){
      await init();
      if(spatial)return spatial.browse(options);
      const limit=Math.max(1,Math.min(80,options.limit||48)),color=String(options.color||"").toLowerCase(),after=options.after||"";
      const rows=latest().boundaries.filter(b=>!color||String(b.color||"").toLowerCase()===color)
        .map(b=>({key:"b:"+b.id,id:b.id,name:b.name||"Untitled curve",color:b.color||"",author:b.founder||b.author||"",frameN:b.frameN||1}))
        .sort((a,b)=>a.key.localeCompare(b.key));
      const start=rows.findIndex(b=>b.key>after),found=start<0?[]:rows.slice(start,start+limit+1);
      const items=found.slice(0,limit);
      return {items,hasMore:found.length>limit,nextCursor:items.length?items[items.length-1].key:null}
    },
    async availableColors(){
      await init();
      if(spatial)return spatial.palette({limit:64});
      return [...new Set(latest().boundaries.map(b=>String(b.color||"").toLowerCase()).filter(c=>/^#[a-f0-9]{6}$/.test(c)))].sort().slice(0,64)
    },
    async regionById(id){await init();return spatial?spatial.resolve(id):latest().boundaries.find(b=>b.id===id)},
    async visibleRegions(rect,options){await init();return spatial?spatial.viewport(rect,options):latest().boundaries.filter(b=>root.IFSpatial.intersects(root.IFSpatial.boundsFromPath(b.d),rect)).slice(0,120)},
    async regionCount(){await init();return spatial?spatial.count():latest().boundaries.length},
    async currentSnapshot(){await init();return latest()}
  };
  return backend;
};
})(typeof window!=="undefined"?window:globalThis);

</script>
<script data-if-spatial="3">
/* Infinite Frames Curve Catalog. Browse indexed metadata first, load exact SVG
   only after the user selects a curve. No naming or artwork mutation here. */
(function(root){
"use strict";
root.IFOpenPathSearch=function(backend,onSelect){
  let closed=false,sequence=0,timer=null,loading=false,more=true,next=null,color=null,total=0;
  const PAGE=48;
  const layer=document.createElement("div");
  layer.setAttribute("role","dialog");
  layer.setAttribute("aria-modal","true");
  layer.setAttribute("aria-label","Explore curves");
  layer.style.cssText="position:fixed;inset:0;z-index:2147483640;background:rgba(2,3,7,.97);backdrop-filter:blur(16px);display:flex;flex-direction:column;align-items:center;padding:max(14px,env(safe-area-inset-top)) 10px max(18px,env(safe-area-inset-bottom));color:#edf0f6;font:13px Manrope,system-ui,sans-serif";
  const shell=document.createElement("div");
  shell.style.cssText="width:min(100%,540px);height:100%;min-height:0;display:flex;flex-direction:column;gap:9px";
  const header=document.createElement("div");
  header.style.cssText="display:flex;align-items:center;justify-content:space-between;gap:9px";
  const title=document.createElement("div");
  title.textContent="EXPLORE CURVES";
  title.style.cssText="font:800 16px Syne,system-ui,sans-serif;letter-spacing:.09em";
  const close=document.createElement("button");
  close.textContent="Close";
  close.style.cssText="border:1px solid #59606c;border-radius:12px;background:#1d2027;color:#fff;padding:11px 15px;min-height:42px;font:inherit;cursor:pointer";
  function exit(){if(closed)return;closed=true;sequence++;clearTimeout(timer);document.removeEventListener("keydown",esc);layer.remove()}
  close.onclick=exit;header.append(title,close);
  const input=document.createElement("input");
  input.placeholder="Search names, artists or colors (optional)";
  input.setAttribute("aria-label","Search curves");
  input.autocomplete="off";
  input.style.cssText="width:100%;min-height:46px;border-radius:13px;padding:11px 14px;background:#12161f;color:#fff;border:1px solid #596271;font:14px Manrope,system-ui,sans-serif;outline:none";
  const paletteLabel=document.createElement("div");
  paletteLabel.textContent="BROWSE BY COLOR";
  paletteLabel.style.cssText="font:700 10px 'JetBrains Mono',monospace;letter-spacing:.12em;color:#9da8b9";
  const palette=document.createElement("div");
  palette.setAttribute("aria-label","Available curve colors");
  palette.style.cssText="display:flex;gap:9px;align-items:center;overflow-x:auto;overflow-y:hidden;flex:none;min-height:38px;padding:1px 0 5px;scrollbar-width:thin";
  const status=document.createElement("div");
  status.style.cssText="font:11px 'JetBrains Mono',monospace;color:#a2adbd;min-height:18px";
  const results=document.createElement("div");
  results.setAttribute("role","list");
  results.style.cssText="overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:7px;padding:1px 0 8px;overscroll-behavior:contain";
  const moreButton=document.createElement("button");
  moreButton.textContent="SHOW MORE CURVES";
  moreButton.style.cssText="border:1px solid #596778;border-radius:12px;background:#171f2c;color:#cceeff;padding:12px 14px;min-height:45px;font:700 11px 'JetBrains Mono',monospace;letter-spacing:.09em;cursor:pointer;display:none";
  const foot=document.createElement("div");
  foot.textContent="Colors and names are indexed. Original SVG detail loads only when you open a curve.";
  foot.style.cssText="font-size:10px;line-height:1.35;color:#7e8797;text-align:center";
  function esc(e){if(e.key==="Escape")exit()}
  function isColor(value){return /^#[a-f0-9]{6}$/i.test(value||"")}
  function row(hit){
    const button=document.createElement("button");
    button.setAttribute("role","listitem");
    button.setAttribute("aria-label","Open "+(hit.name||"Unnamed curve")+" in frame "+hit.frameN);
    button.style.cssText="display:flex;gap:12px;align-items:center;width:100%;min-height:63px;padding:9px 12px;text-align:left;border:1px solid #363f4b;border-radius:13px;background:#11171f;color:#f0f4fb;font:inherit;cursor:pointer;flex:none";
    const chip=document.createElement("span");
    const fill=isColor(hit.color)?hit.color:"#777";
    chip.style.cssText="display:block;flex:none;width:34px;height:34px;border-radius:10px;background:"+fill+";border:2px solid rgba(255,255,255,.7);box-shadow:0 0 0 1px rgba(0,0,0,.5)";
    const labels=document.createElement("div");
    labels.style.cssText="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px";
    const name=document.createElement("div");
    name.textContent=hit.name||"Unnamed curve";
    name.style.cssText="font-weight:750;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis";
    const details=document.createElement("div");
    details.textContent="Frame "+(hit.frameN||1)+(hit.author?" · "+hit.author:"")+" · "+(isColor(hit.color)?hit.color.toUpperCase():"Color unknown");
    details.style.cssText="font:10px 'JetBrains Mono',monospace;color:#a6b1c1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis";
    const arrow=document.createElement("span");
    arrow.textContent="⌕";
    arrow.style.cssText="font-size:23px;color:#9fdff5";
    labels.append(name,details);button.append(chip,labels,arrow);
    button.onclick=async()=>{
      if(closed)return;
      button.disabled=true;status.textContent="Retrieving exact SVG path…";
      try{
        const full=await backend.regionById(hit.id);
        if(!full||!full.d)throw Error("Exact curve path is unavailable");
        await onSelect(full);
        exit();
      }catch(e){button.disabled=false;if(!closed)status.textContent="Could not open curve: "+(e.message||e)}
    };
    return button;
  }
  const chips=[];
  function updatePalette(){
    for(const item of chips){
      const active=item.value===color;
      item.el.style.outline=active?"2px solid #d9f5ff":"none";
      item.el.style.outlineOffset="2px";
      item.el.setAttribute("aria-pressed",String(active));
    }
  }
  function addChip(value,label){
    const b=document.createElement("button"),valid=isColor(value);
    b.title=valid?"Show "+value.toUpperCase()+" curves":label;
    b.setAttribute("aria-label",valid?"Filter by "+value.toUpperCase():"Show all curve colors");
    b.style.cssText="display:grid;place-items:center;flex:none;height:32px;min-width:"+(valid?"32px":"62px")+";width:"+(valid?"32px":"auto")+";border-radius:"+(valid?"50%":"17px")+";border:1px solid #a1b0bd;background:"+(valid?value:"#232c3b")+";color:#fff;font-size:10px;font-weight:700;padding:0 9px;cursor:pointer";
    if(!valid)b.textContent=label;
    b.onclick=()=>{color=value;input.value="";updatePalette();loadBrowse(true)};
    chips.push({value,el:b});palette.appendChild(b);
  }
  async function loadBrowse(reset){
    if(closed)return;
    if(reset){sequence++;next=null;more=true;loading=false;total=0;results.replaceChildren();results.scrollTop=0}
    if(loading||!more)return;
    const ticket=sequence;loading=true;moreButton.style.display="none";
    status.textContent="Loading indexed curves…";
    try{
      const page=await backend.browseRegions({limit:PAGE,after:next,color});
      if(closed||ticket!==sequence||input.value.trim())return;
      for(const hit of page.items||[])results.appendChild(row(hit));
      total+=(page.items||[]).length;
      next=page.nextCursor;more=Boolean(page.hasMore);
      status.textContent=total?total+" curves shown"+(more?" · more available":" · end of catalog"):"No curves found"+(color?" in this color":" yet");
      moreButton.style.display=more?"block":"none";
    }catch(e){if(ticket===sequence&&!closed){status.textContent="Could not load catalog: "+(e.message||e);moreButton.style.display="block";moreButton.textContent="RETRY"}}
    finally{if(ticket===sequence)loading=false}
  }
  async function runSearch(){
    if(closed)return;
    const q=input.value.trim();if(!q){loadBrowse(true);return}
    const ticket=++sequence;loading=false;results.replaceChildren();moreButton.style.display="none";status.textContent="Searching metadata…";
    try{
      const hits=await backend.searchRegions(q,{limit:80});
      if(ticket!==sequence||closed)return;
      for(const hit of hits)results.appendChild(row(hit));
      status.textContent=hits.length?hits.length+" matching curves":"No matching curves. Try browsing colors instead.";
    }catch(e){if(ticket===sequence&&!closed)status.textContent="Search failed: "+(e.message||e)}
  }
  input.addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(runSearch,160)});
  moreButton.onclick=()=>loadBrowse(false);
  document.addEventListener("keydown",esc);
  shell.append(header,input,paletteLabel,palette,status,results,moreButton,foot);
  layer.append(shell);document.body.append(layer);
  addChip(null,"ALL");
  updatePalette();
  backend.availableColors().then(colors=>{
    if(closed)return;
    for(const c of colors||[])if(isColor(c))addChip(c,null);
    updatePalette();
  }).catch(()=>{paletteLabel.textContent="BROWSE ALL CURVES"});
  loadBrowse(true);
  return exit;
};
})(typeof window!=="undefined"?window:globalThis);
</script>

Time as co-author.\n\n> **One canvas. Infinite perspectives. No final frame.**  \n> The artwork is not simply the final image. It is the complete, navigable relationship between **space, time, and people**.\n\n---\n\n# PART I — PURPOSE AND CONSTITUTION\n\n## 1. Why Infinite Frames exists\n\nInfinite Frames (IF) is one living, collaborative artwork and an experiment in how people and AI can coordinate creative work without erasing individual identity. People may draw, trace, write, suggest ideas, add media, respond to an earlier piece, discover relationships, or help determine how the system evolves. No professional art skill is required.\n\nAI is intended to lower barriers and help people coordinate, **not replace human voices or determine what art must mean**. Human differences can create useful contrast and new connections. The platform should reward meaningful continuation, collective discovery, and relationships, not compulsive attention or an arms race for popularity.\n\n## 2. Constitutional rules that survive the reconciliation\n\n**C01 · Shared creative agency.** People can explore, contribute, respond, propose changes, and build upon available regions. Rights may depend on transparent safety, consent, and region rules, not fame or likes.\n\n**C02 · Attribution and lineage.** Every published contribution has a stable identity, an attributed author or pseudonym, a timestamp, a frame, a location, and an explicit parent/relationship when relevant. Contributions remain connected to their origins.\n\n**C03 · Publish creates permanence.** Drafts may be moved, scaled, rotated, recolored, undone, or discarded. A deliberate **Publish / Drop** action validates and commits a contribution. After publication it cannot be silently repositioned, rewritten, or erased. Corrections, remixes, and reversals create traceable new versions or events. Moderation and lawful privacy deletion need controlled exceptions.\n\n**C04 · Freedom within boundaries.** Every contribution happens within a clearly defined creative context. Rules protect continuity without dictating artistic content. A closed boundary can constrain area, color family, medium, or temporal frame; visitors must be able to inspect those rules before publishing.\n\n**C05 · Inherited context, independent authorship.** Child contributions inherit the spatial coordinate system and applicable constraints of their parent region. The parent contributor does not acquire ownership of the child's artwork. Modifying a child cannot silently change its parent or siblings.\n\n**C06 · Founding shapes retain structural significance.** Early published boundary shapes form visible anchors for the regions built within them. Their structural role persists through later frames, even if their imagery becomes more subdued. This is **visual lineage**, not perpetual political control or exclusive commercial ownership.\n\n**C07 · Renewable creative freedom.** An established region may become more constrained as its collective history grows. Fresh regions, subregions, branches, and frame opportunities preserve meaningful opportunities for late arrivals. No first-arrival land grab may permanently exhaust the canvas.\n\n**C08 · Fair presence.** Every valid contribution deserves a discoverable presence; status and popularity do not buy more basic screen rights. Likes may rank overlapping comments or proposals, but cannot grant editing power. Structural prominence, temporal recency, and popularity are separate concepts.\n\n**C09 · Time remains navigable.** Every published frame, event, contribution, and prior artwork state remains retrievable, subject to legitimate safety/privacy exceptions. A new frame cannot overwrite a former frame's historical record. Users can scrub time, inspect the exact moment, and discover who changed what.\n\n**C10 · Collective intelligence arises through interaction.** The system encourages shared memory, attention, and reasoning: responding to work, building bridges, examining contrast, and proposing improvements. Merely accumulating uploads is insufficient.\n\n**C11 · AI advises, people choose.** AI may assist creation, tracing, translation, discovery, connection proposals, and coordination. Its generated content and recommendations are identified as AI-assisted, explainable where possible, reversible before publication, and subject to human choice and the same region rules.\n\n**C12 · The art stays central.** Mobile-first immersion, minimal interface, proximity-based details, smooth navigation, and accessible gestures must be preserved. The interface must never bury the artwork under controls.\n\n**C13 · Rules evolve visibly.** Blueprint amendments have a proposer, rationale, feedback, decision, version, adoption record, and history. Community voice is protected while actual approval/administrative powers must be explicitly defined; technical admin access is not unlimited creative authority.\n\n**C14 · Public safety, consent, and privacy.** Verification against technical rules is objective where possible, but harassment, impersonation, abuse, rights violations, spam, and private data require separately governed interventions. No public activity log of private, transient actions by default.\n\n**C15 · Shared value without premature promises.** Recognition and possible contributor compensation are important goals. Revenue allocation, sponsorship, rental of screen areas, or other economic mechanisms require a separately approved and audited policy; none currently convey speculative property rights.\n\n**C16 · Test before deployment.** A feature ships only after a measurable experiment shows user value and no breakage of saving, navigation, identity, history, attribution, or access. Preserve recoverable production versions and distinguish local prototypes from verified shared builds.\n\n**C17 · Shared spaces, discoverable gatherings, voluntary sharing.** Individuals and live creative groups may appear as spatially anchored profile presences in the shared artwork. Public groups and their active-member counts are discoverable by everyone through the canvas and search. Joining a group does not silently grant access to a person's device, screen, private drafts, microphone, or camera. Screen sharing is explicit, consent-based, and stoppable at any moment. Group visibility and participation must follow safety, attribution, and privacy rules.\n\n---\n\n# PART II — THE WORLD: SPACE, TERRITORY, AND INHERITANCE\n\n## 3. One world, not a pile of unrelated canvases\n\nAll public contributions participate in one spatially navigable artwork. The shared universe may contain nested regions, scenes, paths, comments, video/GIF/animation objects, and hidden detail. Root artwork retains the **full prism and rainbow**. The incoming white beam represents ideas; the triangle suggests interpretation and connections; colored outgoing beams lead to creative pathways. The colors guide exploration without permanently classifying people.\n\n**Spatial continuation** means adding new regions, objects, subregions, or entryways at new zoom depths. **Temporal continuation** means authoring the artwork's next frame/state. Both exist, and neither replaces the other.\n\n## 4. Founding territory: the first boundaries\n\nThe first published closed curves in a region create its initial **structural map**. A region might be a portrait silhouette, heart, star, color beam, or any other closed SVG path. These pioneering boundaries give the composition recognizable areas for others to enter and build within.\n\n- A region occupies defined coordinates within the shared artwork, not ownership of a user's phone pixels. The current screen viewport is a convenient creative/print framing tool; its world coordinates are stored so different phones see the same artwork.\n- The creator of a first boundary is credited as its founder and may see that identity attached to the outline when approached.\n- Within the boundary, later contributors may make new shapes, textures, narratives, subregions, or creative worlds under published local rules.\n- The founding outline has a persistent but **subtle, optional visual presence** in later frames. It may appear as a fine contour, reveal-on-approach marker, or lineage overlay. It must not cover newer artists or crowd out their work.\n- Founders define the starting geometry and initially permitted creative context. They cannot retroactively change others' published contributions or claim every nested artwork as their own.\n- Avoid territory hoarding: establish quotas, expiry/reopening of unused reservations, or fair rotation of initial boundary opportunities before public launch. These values are **not yet decided**.\n\n**Reconciled principle:** Early creators shape the visual structure; later creators shape what happens inside it. Each is traceable and meaningful.\n\n## 5. Closed curves and creation constraints\n\nPublished artwork is **vector-first** whenever feasible. Images and text can be converted to traced SVG closed paths; creators control tracing tolerance and can select multiple colors or black-and-white hard-edge tracing. Complex images may require multiple islands/paths; self-crossing curves must split into valid selectable regions or be reported as invalid before publication. Preserve original media as evidence when rights and storage permit.\n\n- A contribution is placed and aligned **as a draft**, including scale and rotation. Publication fixes its position in world/region coordinates.\n- Boundaries must be selectable with outlines that align while zooming; selection should target the intended colored island, not fall through to the background.\n- A local color rule can allow a configurable range of variation rather than force a single unchangeable hue. Exact limits remain configurable and visible.\n- Groups are permitted; grouping does not remove each member's authorship or independently owned objects.\n- Geometric validation is not artistic judgment. Non-drawing text, comments, and ideas are meaningful contributions too.\n\n## 6. Infinite zoom and spatial loading\n\nZoom-out stops at the current published spatial extent and expands as contributors extend the universe. Zoom-in supports arbitrarily deep nested detail in the **conceptual model**, implemented with practical performance limits, progressive scene loading, and spatial indexing (e.g., QuadTree/tiles) rather than a literal browser promise of mathematical infinity.\n\nObjects inherit stable local-to-world transforms; zooming should not deform shapes or detach overlays. Load only relevant viewport/nearby content and appropriate low-detail representations at distant zooms. Spatial indexing determines **what to load**, not who has permission to edit or how live synchronization works.\n\n---\n\n# PART III — TIME: FRAMES, LAYERS, AND EVERY MOMENT\n\n## 7. Four terms that must not be confused\n\n1. **Spatial region**: a bounded place inside the artwork, potentially containing deeper subregions.\n2. **Authored frame**: a deliberately published visual state or step in an intended animation sequence, e.g., Frame 1 then Frame 2.\n3. **Event history**: the immutable sequence of edits, publications, comments, votes, and state changes, used for replay. This is not automatically the same as an authored animation.\n4. **Print / render layer**: a physical transparency, paper sheet, or rendering plane that can correspond to a chosen frame or subset of objects. A print layer may be exported or exploded into 3D. It is **not required** to equal one event or one spatial region.\n\nThese systems share provenance and timing but remain distinct so playback, history, physical prints, and nested zoom remain understandable.\n\n## 8. Frame succession: when the artwork moves to Frame 2\n\nA scene begins with **Frame 1**, in which initial contributors establish the dominant boundaries and add the first visible contributions. At a defined interval or completion condition, **Frame 1 is closed to ordinary new publishing and Frame 2 opens**. The new frame inherits the prior frame's region map, reference imagery, permissions, contributor history, and available continuation areas.\n\n**Proposed frame lifecycle** (not yet an adopted timing policy):\n\n`OPEN FOR CONTRIBUTIONS → REVIEW / FINALIZE → PUBLISHED FRAME → NEXT FRAME OPENS`\n\nPossible triggers: elapsed time, a percentage of eligible space filled, a contributor-led decision, or a transparent community vote. A default duration, who may advance the frame, and late-arrival handling **remain open decisions**. The transition should never discard unfinished personal drafts without warning or cause racing publications to corrupt state.\n\n**Each frame is an addition, not a replacement.** Frame 2 is influenced by Frame 1; Frame 3 by Frame 2 and the inherited foundation; the sequence can continue indefinitely. Optional branch sequences may exist later without breaking the canonical frame order for a scene.\n\n## 9. Onion-skin visibility, including founders\n\nWhen viewing/creating Frame N:\n\n- **Frame N** is the active, primary artwork.\n- **Frame N−1** is the strongest ghost/reference.\n- **Frame N−2 and earlier** become progressively lighter as their temporal distance grows.\n- **Founding structural outlines** may remain visible independently as subdued guides no matter how old they are, because they explain the region's ancestry.\n- Viewers can choose how many previous frames show, change opacity, or switch onion skin **off**. This should never permanently alter the artwork.\n\nThe exact opacity curve, number of ghosts, and whether past imagery is filtered are **viewer-controlled or to be tested**, not eternal constitutional constants. Older frames never disappear from storage because their ghost opacity reaches zero.\n\nFor example: while editing Frame 3, Frame 2 is the clearest onion skin; Frame 1 is fainter; the original boundary outline can remain as a delicate guide. A viewer can travel directly back to Frame 1 and see it at its **original, full fidelity**, not merely the faint ghost.\n\n## 10. All moments remain reachable\n\nA time scrubber/filmstrip, **replay**, and contributor/history links let users choose any published authored frame or inspect how a frame changed while it was being made. Preserve:\n\n- exact ordered publication and meaningful revision events;\n- author/time/parent region/frame for each published piece;\n- previous visual states (stored or reconstructable with snapshots + events);\n- comments, ideas, and rule decisions associated with the relevant time/location, with privacy exceptions;\n- optional replay of the selected visible viewport instead of forcing a global replay.\n\n**Authored frame playback** shows intentional sequential images; **history replay** shows how people built them. Both should be independently accessible. Preserve earlier frames even when their imagery is no longer in the current composite.\n\n## 11. Stack, print, and explode\n\nThe normal view is a flat composite. An optional **exploded 3D layer view** transitions into a depth stack. Users can orbit, separate planes, adjust gap size, flip a selected layer, inspect lineages/edges, and return smoothly to flat. Keep the control surface small.\n\nA scene/frame can be exported onto **registered, consistent physical sheets or transparencies**: specify dimensions, safe margins, alignment marks, and print scale before export. Screen-sized composition is a digital editing convenience; printing needs physical calibration. Layer order and earlier contributors' silhouettes can be included as selectable export options.\n\nScanimation may interlace authored frames with vertical or directional masks. Edge stripes on exploded or printed layers are a promising artistic experiment, **not automatic working scanimation** without calibrated pitch, mask spacing, alignment, viewing angle, and motion. Preserve it as an optional mode.\n\n---\n\n# PART IV — THE PERSONAL, NEAR-INVISIBLE INTERFACE\n\n## 12. The floating profile is the primary controller\n\nDefault view is the artwork full-screen, with a **small floating profile image clipped inside a closed SVG shape**. The outer shape can be a circle, heart, star, user-drawn curve, or another valid closed silhouette. The profile's outline automatically updates to the **last newly created shape** the user adds to the canvas, first in draft preview and then confirmed on publish. Discarding that draft restores the previous confirmed outline. This avatar shape is personal UI, not an ownership claim over the region where the shape was created.\n\n**Touch behavior:** touch and drag the profile to reposition it, without a three-second hold. When near an edge, the related panel fades/warps into view; the profile can be pulled into its interaction area. Once activated, the panel stays usable without requiring a finger to remain down. A narrow, softly glowing edge/grab indicator shows how to return to the canvas by pulling the profile away. Avoid accidental panel opening while simply moving the profile: use a clear proximity/commit threshold and test it on real phones.\n\nEdge headers remain tiny and discoverable:\n\n- **LEFT / CONSUME:** explore, Take Me Somewhere, Advise Me, Connection Atlas, Mind Map, Constellation, Discovery, replay, contributions.\n- **RIGHT / CREATE:** shapes, draw/erase, trace, select color, import image/GIF, text-to-SVG, edit, rotate, place, preview, Publish, layer controls.\n- **TOP / PROFILE:** identity, avatar photo and outline, personal contributions, links and preferences.\n- **BOTTOM / CHAT:** conversations, artwork-anchored comments/replies, community activity, idea proposals, Agree/Disagree/New Idea votes, Living Blueprint discussions.\n\n**People and group markers:** Other visitors appear in the canvas using the same closed-curve profile-portrait visual language as the user's floating controller, but only **the user's own profile** is draggable to open the four main tool panels. Tap a remote profile to inspect that person or their public contributions. A group appears as a **small overlapping stack of member profiles**, visually distinct from a single person; tapping it opens the group card. Group profile markers and group rings become clearer on approach and simplify or cluster when zoomed out.\n\nPanels and tools are compact, layered glass with subtle optical distortion and restrained rainbow light, consistent with the IF logo. Keep the canvas visible; nested tool choices stay collapsed until requested. A compact **Layers control** may remain near the top-right, balanced against the IF brand, with lens/overlay choices **off by default**. Avoid additional floating UI elements unless testing proves they help.\n\n## 13. Proximity and journeys\n\nThe user should see less metadata from far away and more detail on approach. Nearby contribution outlines, participant bubbles, comments, and actions fade in; leaving naturally fades them out instead of demanding X buttons. Dense nearby comments can be ranked, but quieter contributions must remain findable. Nonvisual and reduced-motion alternatives are mandatory.\n\n**Take Me Somewhere** selects a meaningful published anchor, eases the camera in/out without teleporting, and avoids repeating locations until the explored set is exhausted. Users can follow profile bubbles and visit a contributor's original location. Long comments become legible through zoom or accessible expansion. **Group hotspots** are also discoverable as viewers move through the world: the ring around an anchored group marker communicates live group size and activity, while a separate number displays the actual active-member count. The ring should enlarge perceptibly as attendance grows, with a visual cap so popular gatherings do not cover others' artwork. Search and journey tools can navigate to saved group anchors.\n\nThe home/root retains the full prism and rainbow rather than isolating a single color beam.\n\n---\n\n# PART V — CONNECTING MINDS AND PEOPLE\n\n## 14. The Connection Atlas\n\nConnections are navigable **proposals** between contributions, not claims that their authors agree or share motives. Supported experimental link types include:\n\n- **Continuity:** someone extends earlier work.\n- **Echo:** color, shape, movement, or composition resonates.\n- **Blur:** broad forms become comparable at reduced detail.\n- **Counterpoint:** differences create a useful artistic contrast, without forcing conflict or winner/loser debates.\n- **People:** collaborations, shared regions, creative histories.\n- **Drift:** unexpected guided journeys.\n- **Resonance:** optional nearby animated elements affect each other's motion.\n- **Community-defined:** contributors identify meanings algorithms missed.\n\nOriginals remain untouched. Viewer Lenses (blur, contrast, color, rhythm) alter **only the viewer's presentation**. Opt-in Blend / Remix produces a separate derived work with provenance and consent; it does not replace the sources.\n\nThe same network should be legible as **Mind Map** (hierarchy), **Constellation** (cross-links), and **Discovery / Connection Quest** (suggested pairs, skip/propose/agree/contrast). All views reference **one canonical relationship record**. AI-suggested links are labeled, explainable, and rejectable. Do not optimize for maximal link count or outrage.\n\n## 15. Ideas, votes, and living governance\n\n**White prism beam:** submit an idea, question, problem, or proposed blueprint amendment.  \n**Triangle:** show interpretation, groups, and candidate relationships.  \n**Colored beams:** help organize and navigate proposals and creative regions; suggested categories can be manually corrected.\n\nA proposal can receive **Agree / Disagree / New Idea**, replies, reasons, and cross-preference support signals. Agreement from contrasting perspectives may be informative, but it does not automatically establish truth or enact policy. The proposal/decision timeline records what was proposed, amended, accepted, rejected, and superseded.\n\nThe **approval authority** for binding constitutional changes is **not yet fixed**. During prototype development, the project owner may control deployment and experiments. Before public collective governance is promised, define eligibility, voting rules, quorum, disputes, moderation, and rights of appeal.\n\n## 16. Shared live collaboration\n\nThe target is cross-device persistent shared contributions and activity, not a claim that any archived local prototype already provides it. The data model supports authenticated users, real-time presence, and event delivery scoped to visible/nearby regions. Multiple visitors may interact concurrently where rules permit; optional exclusive **turn-based zones** have an atomic reservation/lease so two people cannot accidentally hold the same turn.\n\nPrevent conflicting edits through permissions, revisions and concurrency checks, or an appropriate shared editing model. Publish operations are server-validated and durable. Presence/cursors are ephemeral; publications/history are permanent as policy allows. Two-account, two-device and refresh tests are required before calling the app multiplayer.\n\n## 16A. Real-time shared spaces and group hotspots\n\n**Purpose:** People can meet at an actual location **inside the infinite canvas**, create together, and optionally show one another what they are seeing or working on. These spaces make collective participation visible in the artwork rather than hiding it in a conventional social sidebar.\n\n**1. Public discoverability and spatial anchors**\n\n- Any active public group appears to everyone as a canvas marker anchored to a **saved world-coordinate location** (region, zoom level, frame or temporal context, and optional descriptive title/tags). Saving an anchor makes it possible to search for, revisit, and navigate back to the gathering later.\n- Individual participants may also appear as spatial profile markers using the same avatar-and-closed-curve language as the personal controller. Respect each participant's presence/visibility settings; a person's presence is not a license to track them indefinitely.\n- Tapping a group marker opens a compact group card: name, topic, live active count, recent public activity, spatial location, and a **Join** action. Group discovery works through proximity, the Consume panel, and search by group name, topic/tag, creator, or canvas region.\n- Public group markers and membership counts remain discoverable even when an individual member has not elected to broadcast a screen. A group may be closed to new members or require approval while still remaining publicly findable; such state must be labeled.\n\n**2. Stacked profiles and colored group rings**\n\n- A group marker visually resembles a **stack of overlapping contributor profile shapes**, not a generic location pin. The stack may show a few representative opted-in avatars, with a `+N` indicator for additional participants.\n- Surround it with a **colored ring** tied to the group's chosen color or visual identity. As the number of **currently active** members increases, the ring's size/intensity increases and indicates a busier canvas hotspot.\n- Always display the **numeric active group count** (for example, `12 active`) so the ring never substitutes for exact numbers. Make ring size a bounded, zoom-aware scale, rather than growing linearly until it obscures neighboring art.\n- Multiple nearby gatherings can collapse into an aggregate hotspot at distant zoom levels. Moving closer reveals individual group stacks and people; ensure markers do not conceal the underlying artwork.\n\n**3. Live collaborative rooms and screen sharing**\n\n- A participant can create or join a group at a chosen canvas location. Members can talk in a group conversation, see shared live actions as allowed, navigate to the group anchor, and contribute together under the local artwork's boundary and publication rules.\n- Distinguish **Follow View** (with permission, synchronize another member's canvas camera, zoom, and selected frame) from **Share Screen** (a live visual stream of a participant's browser tab or screen, where supported). Neither starts automatically on joining.\n- Screen sharing requires deliberate action, a clear live-sharing indicator, viewer/participant permissions, and an immediately available **Stop Sharing** control. Never assume permission to capture the entire phone screen; browser/mobile restrictions may require a supported fallback such as Follow View.\n- A group is not an ownership layer. Each person's published work retains their own identity, parent region, frame, and provenance, and existing publish/lock and conflict rules remain in effect. Shared viewing does not allow a participant to move another's published work.\n\n**4. Persistent locations, transient presence**\n\n- Save the **group meeting anchor** as a discoverable location, with optional descriptions, tags, and public historical references. Allow a group to reconvene at the same coordinates across sessions or to publish a new named meeting anchor when it moves.\n- Track the **active count from current presence** and expire stale sessions. Do not mistake total historic members for people currently present.\n- Live media, live cursor movement, and ephemeral attendance are not automatically written into the permanent artwork timeline. Save only agreed public events and actual published contributions; don't record private shared screens by default.\n\n**5. Prototype acceptance test**\n\nWith two or more devices: create a public group at a canvas coordinate; verify the same stack, ring, and active count appear to outside observers; join/leave and see active count change; search by group title and jump to its saved place; start and stop an explicitly consented Follow View or screen share; refresh and verify that the group anchor persists but stale people no longer count as active. Confirm users can still open all four profile-navigation panels and the group overlays don't obstruct creating art.\n\n**Status:** Proposed functionality, not a claim that real-time meetings, screen capture, or worldwide presence are already implemented. Exact participant limits, moderation policy, role permissions, and per-device sharing support require testing.\n\n## 17. Community, attribution, physical portals\n\nComments are attached to real spatial coordinates and may be surfaced through nearby contributor profile bubbles. Conversations also live in a pull-up community panel that shows meaningful activities, suggestions, and decisions; do not overwhelm it with every low-level cursor or tap.\n\nQR codes on physical artwork may open a particular region, frame, contributor story, or legitimate contribution opportunity. Respect privacy, actual rights to shared source images, and physical scanning reliability. This is an experimental bridge between the tangible art and the digital universe.\n\n---\n\n# PART VI — DATA AND OPERATIONAL TRUTH\n\n## 18. Canonical objects and events\n\nSuggested entities (design model, not proof of deployed tables):\n\n```\nRegion: id, parentRegionId, worldTransform, closedBoundarySVG,\n        founderId, frameCreated, localRules, state, childIds\nContribution: id, regionId, frameId, authorId, kind,\n              originalAssetRef, geometrySVG, colorStyle, worldTransform,\n              publishedAt, parentContributionId, provenance, status\nFrame: id, sceneId, ordinal, openedAt, closedAt, parentFrameId,\n       inheritedBoundaryRefs, snapshotRef, transitionPolicy, status\nEvent: id, subjectId, actorId, eventType, frameId, regionId,\n       occurredAt, revision, publicVisibility, payloadRef\nConnection: id, fromId, toId, type, proposerId, explanation,\n            consentStatus, status, createdAt\nBlueprintVersion: version, snapshot, proposerId, reason,\n                  approvalRecord, adoptedAt\nGroupSpace: id, name, hostId, color, discoverability, joinPolicy,\n            anchorRegionId, anchorFrameId, anchorWorldPosition,\n            anchorZoom, tags, createdAt, lastGatheredAt, status\nGroupMembership: groupId, userId, role, joinedAt, leftAt, consentFlags\nGroupPresence: groupId, sessionId, userId, lastSeenAt, status\nGroupActivity: groupId, eventId, publishedVisibility, anchorRef\nShareSession: groupId, presenterId, mode, startedAt, endedAt,\n              participantPermissions, consentState\n```\n\nThe event log and published objects are the source of truth. Rendered canvases, onion skins, spatial indexes, preview images, and 3D stacks are **derived views**. Privacy-sensitive events need access controls and retention rules; a permanent art history is not permission to expose private data indefinitely.\n\n## 19. Reliability and performance\n\nExisting shared Supabase concepts may be reused if verified, but do not presume every local prototype, ChatGPT-hosted site, Google AI Studio build, or Clerk/Cloud deployment shares the same database. Never overwrite the newest working artwork or accounts with an older demonstration.\n\nUse spatial tiling/QuadTrees or equivalent indices to fetch relevant regions, progressive rendering for remote zoom detail, and scoped collaboration channels for relevant changes. Index public group anchors spatially and by text/tags; discover relevant group presence without broadcasting every member's position globally. Use authenticated session-aware presence with heartbeat/expiration for accurate active counts and permission-scoped real-time rooms for screen/viewport sharing. Do not broadcast every cursor stroke globally. Provide local draft resilience and clear publish success/error feedback. Confirm actual persistence and login/location restoration on separate devices before launching.\n\n## 20. Sustainable value\n\nCollective cultural value is the first objective. Possible future earned value includes physical print editions, licensed collaborative artworks, support for community projects, optional sponsored spaces, and revenue participation, **subject to explicit consent, safety, transparent accounting, and contributor rights**. Sponsorship or financial scale must not turn the shared canvas into a pay-to-dominate attention system.\n\n---\n\n# PART VII — DEVELOPMENT ORDER, DECISIONS, AND RECONCILIATION\n\n## 21. Smallest testable path (one experiment at a time)\n\n**Gate 0 — Recoverable baseline:** identify, back up, and verify the intended production build. Do not reset the root prism, history, profiles, users, or backend.\n\n**Experiment 1 — Profile and shape navigation:** mobile floating profile; last created shape changes avatar outline; left/right/top/bottom gestures work; no accidental panel trapping. Confirm first-time users discover tools.\n\n**Experiment 2 — Spatial founder + child:** one user publishes a closed region; another contributes inside it; both identities and rules survive refresh. Founder outline stays a subtle anchor; child art stays independent and discoverable.\n\n**Experiment 3 — Frame 1 → Frame 2:** use a deliberately short test window. Close Frame 1, open Frame 2 inheriting regions; ghost Frame 1 beneath Frame 2, with the previous frame stronger than older ghosts; scrub back to original Frame 1. This **is the best next test of the newly clarified vision**, once publishing is reliable.\n\n**Experiment 4 — History vs authored playback:** show that a viewer can independently play the intentional frame sequence and replay the actual sequence of published changes, without missing credits or changing originals.\n\n**Experiment 5 — Layer separation:** flatten/explode the same 2D stack into 3D with orbit, separation and return. Physical output/scanimation comes only after dimensional/calibration tests.\n\n**Experiment 6 — Shared group hotspot:** create a public group at a saved canvas location; join from a second device; see the stack, colored growth ring, and exact active count change live on a third device; search for the group and travel to its anchor; test consented Follow View / screen sharing and Stop Sharing without exposing private screens. Keep it isolated until cross-device privacy and presence tests pass.\n\n**Later experiments:** expanded simultaneous editing, spatially scoped syncing at scale, relationship discovery, AI assistance, QR portals, economics. Prioritize whichever missing reliability gate blocks the path.\n\nEach experiment records participant behavior, save/reload result, mobile usability, fairness, and a **keep / revise / revert** decision. Do not launch all features together.\n\n## 22. Issues reconciled, with explicit resolutions\n\n| Earlier tension | Reconciled decision |\n|---|---|\n| First people more visible **vs** equal participation | Founders' **region outlines** remain structural anchors; newcomers retain equal basic contribution/discovery rights, and likes convey no edit privilege. |\n| Once placed it's permanent **vs** need to move/rotate | Drafts are fully adjustable. **Publish** locks the spatial placement; later modifications are new attributed revisions or authorized branches. |\n| Infinite zoom **vs** growing animation | Spatial nesting is independent from authored temporal frame succession. Both share world coordinates and provenance. |\n| Newest frame strongest **vs** earliest outlines always seen | Two separate visual channels: recent-frame onion skin for temporal continuity, and optional subtle founder-boundary overlay for structure. |\n| All frames always available **vs** faded older art | Fading is a **view effect only**. History keeps every frame and state retrievable at original fidelity, within policy exceptions. |\n| Time period **vs** area coverage triggers next frame | Both are candidate policies. Exact trigger, authority and late-draft handling are **not yet adopted**. |\n| On-screen real estate **vs** different device dimensions | Use stable world/region coordinates and configurable composition/print bounds; a device viewport is a temporary lens. |\n| Multiplayer simultaneous editing **vs** one person at a time | Different regions can be live-editable concurrently; optional turn-based zones use explicit leases. |\n| User-suggested boundary rules **vs** living community constitution | Region-specific artistic rules follow the currently accepted constitution and cannot retroactively remove others' rights. |\n| Connected status badge **vs** actual shared data | Only cross-device save, refresh, and two-user tests count as verification. |\n| Beauty/hidden UI **vs** discoverability | Minimal persistent edge clues, first-use help and accessible alternatives; disappearing controls never conceal critical actions permanently. |\n| AI categorization **vs** human creativity | AI proposes, labels suggestions, and can be corrected or ignored; no implied emotional truth. |\n| Individuals **vs** group profiles | All use the same shaped-avatar language. The user's own profile alone controls edge navigation; remote individuals and stacked group profiles are discoverable canvas markers. |\n| Everyone can see groups **vs** screen-sharing privacy | Public group markers, titles, anchor locations and active counts are visible to everyone; screen/viewport sharing needs an explicit participant choice and access policy. |\n| Larger groups deserve larger hotspot rings **vs** equal visual presence | Rings scale with *live attendance* but have visual caps, distance-aware clustering, and a numeric count. They indicate activity without granting territory rights or obscuring other work. |\n\n## 23. Open decisions (do not silently fix these in a build)\n\n1. **Frame clock:** How long is a scene's active frame? Fixed interval, activity/coverage threshold, or both?\n2. **Frame closer:** Who can close/publish a frame, and how do contributors finish drafts safely at the deadline?\n3. **Founder allocation:** Maximum starting region area per contributor and how abandoned/unworked regions reopen.\n4. **Anchor rendering:** Exact width/opacity/zoom threshold for founder outlines, and how to toggle them.\n5. **Scope:** Is the time sequence global, per scene, or per region? A per-scene sequence with inherited local regions is a practical test hypothesis, **not adopted fact**.\n6. **Composite policy:** How objects from older frames appear in the current one, beyond adjustable onion skins.\n7. **Governance:** Who ratifies constitutional amendments; how votes and minority protections work.\n8. **Physical layers:** Sheet dimensions, registration system, and which authored frames map to printable planes.\n9. **Remixing and monetization:** Creator licensing/consent, derivative works, eligibility and accounting.\n10. **Technical source of truth:** Confirm the latest live app/build, backend and schemas before implementing.\n11. **Group discovery:** Can anyone join a public group, or may hosts require approval? What restrictions apply to public group names and avatars?\n12. **Sharing defaults:** Should Follow View be group-viewable while full screen sharing is restricted to opted-in members? Exact permissions, device support and moderation need decisions.\n13. **Group permanence:** Can archived groups remain searchable at their original canvas locations, and what public history persists after the last person leaves?\n\n## 24. Document history and source reconciliation\n\nThis version combines and supersedes **for review only** these available draft strands:\n\n- `IF_Master_Blueprint.md` (November 8): 12 constitutional principles, object/region/event model, spatial vs temporal continuation, visual standard, and validation gates.\n- `Infinite_Frames_Living_Blueprint.txt` v1.2 (November 9): human differences, freedom within boundaries, renewable freedom, shared value, collective intelligence through interaction, and human-centered AI.\n- IF-09 Connection Atlas draft supplied in conversation: white/triangle/colored prism, Continuity/Blur/Echo/Drift/People links, community-derived connections, skippable intro and Blur Discovery test.\n- UI/UX v2 conversation draft: floating profile/last-shape outline, four touch-drag edge panels, proximity UI, stacked print layers and optional exploded 3D/scanimation.\n- Recent revisions: creator territory, publish/drop permanence, optional named contributions, print-sized composition, frame transition and onion-skin inheritance, equal basic presence, and infinitely accessible earlier moments.\n- **v1.4 addition (November 11):** public, spatially discoverable collaboration groups; stacked profile markers; live member-count rings as canvas hotspots; joinable real-time rooms; voluntary screen/viewport sharing; and persistent searchable canvas meeting anchors.\n\n**This is a design reconciliation, not verification of every historical 36-section charter or every live implementation.** If an older, longer official constitution has additional provisions not in the available source materials, compare that file before formally ratifying v1.4. No live site or database has been modified.\n\n---\n\n# FINAL DECLARATION\n\nThe first contributors draw the boundaries of a world. The people after them fill it with meanings the founders could not have anticipated. The world advances to another frame without erasing the one before it. Its nearest past guides the present; its distant past remains reachable, not forgotten. Anyone can travel through its regions, its frames, and the choices of the people who made it.\n\n**Early creators give the artwork its structure. Every contributor gives it its life. Time allows both to continue.**\n\n**ONE CANVAS. INFINITE PERSPECTIVES. NO FINAL FRAME.**  \n**FLOW BELONGS TO ALL.**\n";</script>
