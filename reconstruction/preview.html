<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Infinite Frames · Reconstruction Preview</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#050507;color:#f0f0f2}*{box-sizing:border-box}body{margin:0;overflow:hidden}button{font:inherit;color:inherit;background:#191a20;border:1px solid #51515b;border-radius:12px;padding:10px 13px;touch-action:manipulation}button[aria-pressed=true]{background:#3b3c48;border-color:#fff}.hud{position:fixed;z-index:10;left:12px;right:12px;top:max(12px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:start;gap:10px;pointer-events:none}.hud>*{pointer-events:auto}.brand{background:#0a0a0dcc;padding:10px 12px;border-radius:12px;font-weight:700;font-size:13px;letter-spacing:.06em}.brand small{display:block;color:#a7a7b2;font-size:10px;font-weight:400;margin-top:3px}.controls{display:flex;gap:5px;flex-wrap:wrap;justify-content:end}.controls button{padding:8px 11px}.stage{position:fixed;inset:0;overflow:hidden;touch-action:none;perspective:1100px;user-select:none}.world{position:absolute;left:50%;top:50%;width:1000px;height:1000px;transform-origin:50% 50%;will-change:transform}.art{width:100%;height:100%;display:block;pointer-events:none}.floor{position:absolute;inset:0;transform-style:preserve-3d}.cube{position:absolute;left:50%;top:50%;width:min(65vw,430px);height:min(65vw,430px);transform-style:preserve-3d;transform:translate(-50%,-50%) rotateX(-58deg) rotateZ(35deg);display:none;will-change:transform}.cube .layer{position:absolute;inset:0;border:1px solid #888;transform-style:preserve-3d;background:#000}.cube .layer img{width:100%;height:100%;display:block}.cube .wall{position:absolute;background:#0e0e11ee;border:1px solid #888;display:flex;align-items:center;justify-content:center;color:#d6d6dd;font-size:12px;letter-spacing:.12em;backface-visibility:visible}.cube .front{inset:0;transform-origin:bottom;transform:rotateX(-90deg)}.cube .back{inset:0;transform-origin:top;transform:rotateX(90deg)}.cube .left{inset:0;transform-origin:left;transform:rotateY(-90deg)}.cube .right{inset:0;transform-origin:right;transform:rotateY(90deg)}.stage.is3d .world{display:none}.stage.is3d .cube{display:block}.bottom{position:fixed;z-index:10;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:7px;align-items:center;background:#0c0c10d9;border:1px solid #34343d;padding:7px;border-radius:16px}.bottom button{min-width:38px}.status{position:fixed;bottom:83px;left:50%;transform:translateX(-50%);color:#aaa;font-size:11px;text-align:center;width:95%;pointer-events:none}.frameLabel{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12px;padding:0 5px}.hidden{display:none!important}
</style></head><body>
<header class="hud"><div class="brand">IF / INFINITE FRAMES<small>RECONSTRUCTION · OFFLINE · READ ONLY</small></div><div class="controls"><button id="reset">Reset</button><button id="mode">Enter 3D</button></div></header>
<main id="stage" class="stage" aria-label="Interactive canvas. Drag to pan, pinch or scroll to zoom."><div id="world" class="world"><img id="art" class="art" alt="Yin-yang fish reference frame" src="../yin-yang-svg/frame-1.svg"></div><div id="cube" class="cube" aria-label="3D stacked frames"></div></main>
<div id="status" class="status" role="status">Drag to pan · Pinch or scroll to zoom · Zoom out beyond the canvas for 3D</div>
<nav class="bottom" aria-label="Frame and zoom controls"><button id="prev" aria-label="Previous frame">‹</button><span class="frameLabel" id="frameLabel">1 / 5</span><button id="next" aria-label="Next frame">›</button><button id="out" aria-label="Zoom out">−</button><button id="in" aria-label="Zoom in">+</button></nav>
<script>
(()=>{'use strict';
const stage=document.getElementById('stage'),world=document.getElementById('world'),art=document.getElementById('art'),cube=document.getElementById('cube'),label=document.getElementById('frameLabel'),modeBtn=document.getElementById('mode'),status=document.getElementById('status');
let frame=1,zoom=1,x=0,y=0,three=false,rx=-58,rz=35,pull=0;const pointers=new Map();let lastPinch=null;
const url=n=>'../yin-yang-svg/frame-'+n+'.svg';
function fit(){return Math.min(innerWidth,innerHeight)*.78/1000}
function render(){if(!three){world.style.transform='translate(-50%,-50%) translate('+x+'px,'+y+'px) scale('+(fit()*zoom)+')';}else{cube.style.transform='translate(-50%,-50%) rotateX('+rx+'deg) rotateZ('+rz+'deg)';}stage.classList.toggle('is3d',three);modeBtn.textContent=three?'Return to 2D':'Enter 3D';label.textContent=frame+' / 5';}
function setFrame(n){frame=Math.max(1,Math.min(5,n));art.src=url(frame);render()}
function set3D(v){three=v;pull=0;status.textContent=v?'Drag to orbit · Zoom in or tap Return to 2D':'Drag to pan · Pinch or scroll to zoom · Zoom out beyond the canvas for 3D';render()}
function zoomAt(f,cx=innerWidth/2,cy=innerHeight/2){if(three){if(f>1)set3D(false);return;}const old=zoom,next=Math.max(.75,Math.min(250000,zoom*f));if(next===old&&f<1){pull+=1;if(pull>=2)set3D(true);return}pull=0;const ratio=next/old;x=(x-(cx-innerWidth/2))*ratio+(cx-innerWidth/2);y=(y-(cy-innerHeight/2))*ratio+(cy-innerHeight/2);zoom=next;render()}
function buildCube(){for(let i=1;i<=5;i++){const el=document.createElement('div');el.className='layer';el.style.transform='translateZ('+((i-1)*18)+'px)';const img=document.createElement('img');img.src=url(i);img.alt='Frame '+i;el.append(img);cube.append(el)}for(const [name,txt] of [['front','PROFILE'],['back','CHAT'],['left','EXPLORE'],['right','CREATE']]){const el=document.createElement('div');el.className='wall '+name;el.textContent=txt;cube.append(el)}}
buildCube();render();
document.getElementById('prev').onclick=()=>setFrame(frame-1);document.getElementById('next').onclick=()=>setFrame(frame+1);document.getElementById('in').onclick=()=>zoomAt(1.55);document.getElementById('out').onclick=()=>zoomAt(.65);modeBtn.onclick=()=>set3D(!three);document.getElementById('reset').onclick=()=>{zoom=1;x=y=0;rx=-58;rz=35;setFrame(1);set3D(false)};
stage.addEventListener('wheel',e=>{e.preventDefault();zoomAt(Math.exp(-e.deltaY*.003),e.clientX,e.clientY)},{passive:false});
stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});lastPinch=null});
stage.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const prev=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const p=[...pointers.values()];if(p.length>=2){const a=p[0],b=p[1],d=Math.hypot(a.x-b.x,a.y-b.y);if(lastPinch!==null&&lastPinch>0)zoomAt(d/lastPinch,(a.x+b.x)/2,(a.y+b.y)/2);lastPinch=d;return}const dx=e.clientX-prev.x,dy=e.clientY-prev.y;if(three){rz+=dx*.45;rx=Math.max(-85,Math.min(-5,rx-dy*.35))}else{x+=dx;y+=dy}render()});
function release(e){pointers.delete(e.pointerId);lastPinch=null}stage.addEventListener('pointerup',release);stage.addEventListener('pointercancel',release);addEventListener('resize',render);
})();
</script></body></html>
