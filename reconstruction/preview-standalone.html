stage.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const prev=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const p=[...pointers.values()];if(p.length>=2){const a=p[0],b=p[1],d=Math.hypot(a.x-b.x,a.y-b.y);if(lastPinch!==null&&lastPinch>0)zoomAt(d/lastPinch,(a.x+b.x)/2,(a.y+b.y)/2);lastPinch=d;return}const dx=e.clientX-prev.x,dy=e.clientY-prev.y;if(three){rz+=dx*.45;rx=Math.max(-85,Math.min(-5,rx-dy*.35))}else{x+=dx;y+=dy}render()});
function release(e){pointers.delete(e.pointerId);lastPinch=null}stage.addEventListener('pointerup',release);stage.addEventListener('pointercancel',release);addEventListener('resize',render);
})();
